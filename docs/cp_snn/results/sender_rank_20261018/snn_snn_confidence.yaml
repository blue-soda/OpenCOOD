binomial_n: 0
binomial_p: 0
comm_range: 100
data_augment:
- ALONG_AXIS_LIST:
  - x
  NAME: random_world_flip
- NAME: random_world_rotation
  WORLD_ROT_ANGLE:
  - -0.78539816
  - 0.78539816
- NAME: random_world_scaling
  WORLD_SCALE_RANGE:
  - 0.95
  - 1.05
data_dir: /data1/tzm/dataset/dair-v2x-c/extracted/cooperative-vehicle-infrastructure
data_manifest: /data1/tzm/workspace/diagnostics/e3dsnn_ap70_20261016_181/pair_manifest.json
dataset: dairv2x
fusion:
  args:
    clip_pc: false
    proj_first: false
  core_method: PairedDAIRFusion
loss:
  args:
    cls_weight: 1.0
    dir_args:
      anchor_yaw:
      - 0
      - 90
      args:
        anchor_yaw:
        - 0
        - 90
        dir_offset: 0.7853
        num_bins: 2
      dir_weight: 0.2
    reg: 2.0
  core_method: point_pillar_dir_loss
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 7
  - 9
model:
  args:
    activation: count4
    anchor_number: 2
    budget_codec:
      bits: 3
      keep_fraction: 0.25
    dir_args:
      anchor_yaw:
      - 0
      - 90
      dir_offset: 0.7853
      num_bins: 2
    ego_aux_weight: 1.0
    enable_ego_aux: true
    freeze_detector_bn: true
    fusion_activation_kind: count4
    fusion_mode: residual
    identity_fusion_init: true
    lidar_range:
    - -100.8
    - -40
    - -3.5
    - 100.8
    - 40
    - 1.5
    message_dropout: 0.1
    message_support: geometry
    receiver_activation: relu
    sender_ranking: confidence
    train_encoder: false
    voxel_size:
    - 0.2
    - 0.2
    - 0.1
  core_method: e3dsnn_sender_rank
name: rank_snn_snn_confidence
noise_setting:
  add_noise: false
num_sweep_frames: 1
only_vis_ego: true
optimizer:
  args:
    eps: 1.0e-08
    weight_decay: 0.0001
  core_method: Adam
  lr: 5.0e-05
postprocess:
  anchor_args:
    cav_lidar_range:
    - -100.8
    - -40
    - -3.5
    - 100.8
    - 40
    - 1.5
    feature_stride: 8
    h: 1.56
    l: 4.5
    num: 2
    r:
    - 0
    - 90
    w: 2
  core_method: VoxelPostprocessor
  dir_args:
    anchor_yaw:
    - 0
    - 90
    dir_offset: 0.7853
    num_bins: 2
  gt_range:
  - -100.8
  - -40
  - -3.5
  - 100.8
  - 40
  - 1.5
  max_num: 100
  nms_thresh: 0.15
  order: hwl
  target_args:
    neg_threshold: 0.45
    pos_threshold: 0.6
    score_threshold: 0.2
preprocess:
  args:
    max_points_per_voxel: 32
    max_voxel_test: 70000
    max_voxel_train: 70000
    voxel_size:
    - 0.2
    - 0.2
    - 0.1
  cav_lidar_range:
  - -100.8
  - -40
  - -3.5
  - 100.8
  - 40
  - 1.5
  core_method: SpVoxelPreprocessor
  voxel_backend: spconv2
root_dir: /data1/tzm/dataset/dair-v2x-c/extracted/cooperative-vehicle-infrastructure/train.json
test_dir: /data1/tzm/dataset/dair-v2x-c/extracted/cooperative-vehicle-infrastructure/val.json
train_params:
  batch_size: 2
  epoches: 10
validate_dir: /data1/tzm/dataset/dair-v2x-c/extracted/cooperative-vehicle-infrastructure/val.json
yaml_parser: load_e3dsnn_params
