name: dair_cobevflow_motion_prediction
data_dir: "/path/to/cooperative-vehicle-infrastructure"
root_dir: "/path/to/cooperative-vehicle-infrastructure/train.json"
validate_dir: "/path/to/cooperative-vehicle-infrastructure/val.json"
test_dir: "/path/to/cooperative-vehicle-infrastructure/val.json"

noise_setting:
  add_noise: False
  args:
    pos_std: 0.2
    rot_std: 0.2
    pos_mean: 0
    rot_mean: 0

comm_range: 100000
num_sweep_frames: &past_k 3
time_delay: 0
binomial_n: 10
binomial_p: 0.3
with_history_frames: true
dataset: "dairv2x"
is_generate_gt_flow: false
is_generate_motion_gt: true
motion_gt_only: true
motion_match_max_dist: 8.0
viz_bbx_flag: false

yaml_parser: "load_point_pillar_params"
train_params:
  batch_size: 4
  epoches: 30
  eval_freq: 1
  save_freq: 1
  max_cav: &max_cav 2
  supervise_single_flag: false

fusion:
  core_method: 'CoDynTrustDAIRIrregularFlowDataset'
  args:
    proj_first: false
    clip_pc: false

preprocess:
  core_method: 'SpVoxelPreprocessor'
  past_k: *past_k
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  cav_lidar_range: &cav_lidar [-100.8, -40, -3, 100.8, 40, 1]

data_augment: []

postprocess:
  core_method: 'VoxelPostprocessor'
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 4.5
    w: 2
    h: 1.56
    r: [0, 90]
    feature_stride: 2
    num: 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: 'hwl'
  max_num: 100
  nms_thresh: 0.15

model:
  core_method: cobevflow_motion_prediction
  args:
    point_pillar_scatter:
      num_features: 64
    input_dim: 4
    output_dim: 2
    num_layers: 2
    d_model: 64
    d_ff: 128
    num_heads: 2
    dropout: 0.1
    use_uncertainty_guide: false

loss:
  core_method: motion_prediction_loss
  args:
    loss_type: smooth_l1
    beta: 1.0
    weight: 1.0

optimizer:
  core_method: AdamW
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [10, 20]
