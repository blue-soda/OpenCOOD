name: dair_ectra_stage2_roi
data_dir: "/path/to/cooperative-vehicle-infrastructure"
root_dir: "/path/to/cooperative-vehicle-infrastructure/train.json"
validate_dir: "/path/to/cooperative-vehicle-infrastructure/val.json"
test_dir: "/path/to/cooperative-vehicle-infrastructure/val.json"

noise_setting:
  add_noise: False

comm_range: 100000
num_sweep_frames: &past_k 3
binomial_n: 10
binomial_p: 0.3
is_no_shift: true
is_same_sample_interval: false
is_generate_gt_flow: true
time_delay: 3

yaml_parser: "load_point_pillar_params"
train_params:
  batch_size: &batch_size 2
  epoches: 30
  eval_freq: 1
  save_freq: 1
  max_cav: &max_cav 2
  supervise_single_flag: false

diagnostics:
  enabled: true
  scalar_interval: 20
  grad_interval: 200
  val_visualize:
    enabled: true
    interval: 400
    max_images: 8
    method: bev

fusion:
  core_method: 'CoDynTrustDAIRIrregularFlowDataset'
  args:
    proj_first: false
    clip_pc: false

preprocess:
  core_method: 'SpVoxelPreprocessor'
  past_k: *past_k
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  cav_lidar_range: &cav_lidar [-100.8, -40, -3, 100.8, 40, 1]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: ['x']
  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [0.95, 1.05]

postprocess:
  core_method: 'VoxelPostprocessor'
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 4.5
    w: 2
    h: 1.56
    r: [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: 'hwl'
  max_num: 100
  nms_thresh: 0.15

model:
  core_method: point_pillar_where2comm_ectra
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *anchor_num
    max_cav: *max_cav
    compression: 0
    backbone_fix: True
    num_sweep_frames: *past_k
    design_mode: 0
    num_roi_thres: -1
    ectra:
      enabled: true
      feature_dim: 64
      hidden_dim: 16
      gate_dim: 16
      time_scale: 10.0
      motion_range: 8.0
      calib_range: 4.0
    ectra_roi:
      enabled: true
      feature_dim: 64
      hidden_dim: 32
      time_scale: 10.0
      residual_range: 2.0
      min_trust: 0.05
    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]
    point_pillar_scatter:
      num_features: 64
    base_bev_backbone:
      resnet: true
      layer_nums: &layer_nums [3, 4, 5]
      layer_strides: [2, 2, 2]
      num_filters: &num_filters [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
      compression: 0
      voxel_size: *voxel_size
    shrink_header:
      kernal_size: [3]
      stride: [1]
      padding: [1]
      dim: [256]
      input_dim: 384
    rain_model:
      voxel_size: *voxel_size
      downsample_rate: 1
      in_channels: 256
      channel_size: 256
      n_head: 8
      dropout_rate: 0
      only_attention: true
      communication:
        round: 1
        thre: 0.01
        gaussian_smooth:
          k_size: 5
          c_sigma: 1.0
      agg_operator:
        mode: 'MAX'
        feature_dim: 256
      multi_scale: true
      layer_nums: *layer_nums
      num_filters: *num_filters

loss:
  core_method: point_pillar_tc_loss
  args:
    cls_weight: 1.0
    reg: 2.0
    aux_weights:
      ectra_motion_loss: 0.05
      ectra_roi_flow_loss: 0.5

optimizer:
  core_method: AdamW
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [10, 20]
